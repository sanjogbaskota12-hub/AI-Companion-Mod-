plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

version = '1.0.0'
group = 'com.aicompanion'

base {
    archivesName = 'AI-Companion'
}

repositories {
    mavenCentral()

    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
}
